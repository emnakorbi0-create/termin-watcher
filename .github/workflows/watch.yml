# Runs the watcher on GitHub's servers, so it works while your laptop is off.
# Each run watches for ~5 hours (a job may last at most 6). The schedule fires every hour so
# a run is always queued behind the current one and starts as soon as it ends: GitHub often
# starts scheduled runs late, and a sparser schedule left gaps of hours without checks.
# Minute 17 avoids the busy top of the hour, where GitHub's delays are worst.
name: Einbuergerung watcher

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: # "Run workflow" button for starting it by hand
    inputs:
      test_alert:
        description: "Only send a test alert"
        type: boolean
        default: false

# Only one watcher at a time; a scheduled run that overlaps waits for the current one.
# GitHub keeps at most one waiting run per group and drops older waiting ones, so the
# hourly schedule never piles up.
concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Watch for free appointments
        run: python watcher.py ${{ inputs.test_alert && '--test' || '--max-minutes 295' }}
        env:
          # Telegram is used when TELEGRAM_BOT_TOKEN is set; otherwise email (SMTP_*).
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCH_INTERVAL_SECONDS: "60"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
