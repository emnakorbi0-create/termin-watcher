; Copy this file to config.ini and fill it in.
; Use EITHER [telegram] OR [smtp] - when [telegram] is present, alerts go to Telegram.

;[telegram]
; From @BotFather (/newbot), and your chat id from @userinfobot.
;bot_token = 123456789:ABC...
;chat_id = 123456789

[smtp]
; Gmail: smtp.gmail.com / 587, and the password is an *App Password*
; (Google account -> Security -> 2-Step Verification -> App passwords), not your normal password.
; Outlook/Hotmail: smtp-mail.outlook.com / 587. GMX: mail.gmx.net / 587. Web.de: smtp.web.de / 587.
host = smtp.gmail.com
port = 587
user = your.address@gmail.com
password = your-app-password
; Where the alert goes (can be the same address).
to = your.address@gmail.com

[watch]
; How often to check (minimum 60). 300 = every 5 minutes, plus up to a fifth of that as random delay.
interval_seconds = 300
; While slots stay available, repeat the email at most this often.
reminder_minutes = 30
